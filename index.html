  const toast = useToast();
  const [active, setActive] = useState(REPORT_LIST[0]);
  const allTickets = [...state.incidents, ...state.requests];
  function exportAs(fmt){ toast('Exporting "'+active+'" as '+fmt+'... (demo)', 'info'); }
  function renderReport(){
    if(active==='Ticket Volume'){
      const byType = [{label:'Incidents', v:state.incidents.length},{label:'Requests', v:state.requests.length}];
      return <ChartCanvas type="bar" data={{labels:byType.map(b=>b.label), datasets:[{label:'Count', data:byType.map(b=>b.v), backgroundColor:[CHART_COLORS.blue, CHART_COLORS.orange]}]}} options={{plugins:{legend:{display:false}}}}/>;
    }
    if(active==='Incident Analysis'){
      const cats = [...new Set(state.incidents.map(i=>i.category))];
      return <ChartCanvas type="bar" data={{labels:cats, datasets:[{label:'Incidents', data:cats.map(c=>state.incidents.filter(i=>i.category===c).length), backgroundColor:CHART_COLORS.blue}]}} options={{plugins:{legend:{display:false}}}}/>;
    }
    if(active==='Service Requests'){
      const items = REQUEST_CATALOG.map(c=>c.name);
      return <ChartCanvas type="bar" data={{labels:items, datasets:[{label:'Requests', data:items.map(it=>state.requests.filter(r=>r.catalogItem===it).length), backgroundColor:CHART_COLORS.orange}]}} options={{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:8}}}}}}/>;
    }
    if(active==='SLA Compliance'){
      const closed = allTickets.filter(t=>['Resolved','Closed','Completed'].includes(t.status));
      const met = closed.filter(t=>slaInfo(t).state==='Met').length;
      return <ChartCanvas type="doughnut" data={{labels:['Met SLA','Breached'], datasets:[{data:[met, closed.length-met], backgroundColor:[CHART_COLORS.green, CHART_COLORS.red]}]}}/>;
    }
    if(active==='Team Performance' || active==='Agent Performance'){
      const key = active==='Team Performance' ? 'assignGroup' : 'assignedAgent';
      const groups = [...new Set(allTickets.map(t=>t[key]))].slice(0,8);
      return <ChartCanvas type="bar" data={{labels:groups, datasets:[{label:'Resolved', data:groups.map(g=>allTickets.filter(t=>t[key]===g && ['Resolved','Closed','Completed'].includes(t.status)).length), backgroundColor:CHART_COLORS.green}]}} options={{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:8}}}}}}/>;
    }
    if(active==='Problem Analysis'){
      const statuses = [...new Set(state.problems.map(p=>p.status))];
      return <ChartCanvas type="bar" data={{labels:statuses, datasets:[{label:'Problems', data:statuses.map(s=>state.problems.filter(p=>p.status===s).length), backgroundColor:CHART_COLORS.purple}]}} options={{plugins:{legend:{display:false}}}}/>;
    }
    if(active==='Change Management'){
      const types = ['Standard','Normal','Emergency'];
      return <ChartCanvas type="doughnut" data={{labels:types, datasets:[{data:types.map(t=>state.changes.filter(c=>c.type===t).length), backgroundColor:[CHART_COLORS.green, CHART_COLORS.blue, CHART_COLORS.red]}]}}/>;
    }
    if(active==='Asset Report'){
      const statuses = ['Available','Assigned','In Repair','Retired','Lost'];
      return <ChartCanvas type="bar" data={{labels:statuses, datasets:[{label:'Assets', data:statuses.map(s=>state.assets.filter(a=>a.status===s).length), backgroundColor:CHART_COLORS.blue}]}} options={{plugins:{legend:{display:false}}}}/>;
    }
    if(active==='Service Performance'){
      return <ChartCanvas type="bar" data={{labels:SERVICES.map(s=>s.name), datasets:[{label:'Related tickets', data:SERVICES.map(s=>allTickets.filter(t=>t.service===s.name).length), backgroundColor:CHART_COLORS.blue}]}} options={{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:8}}}}}} height={280}/>;
    }
    return null;
  }
  return <div style={{display:'grid', gridTemplateColumns:'220px 1fr', gap:16}}>
    <Card style={{padding:8}}>
      {REPORT_LIST.map(r=>(
        <div key={r} onClick={()=>setActive(r)} style={{padding:'9px 12px', borderRadius:'var(--radius-sm)', cursor:'pointer', fontSize:12.5, fontWeight: active===r?600:500, background: active===r?'var(--info-bg)':'transparent', color: active===r?'var(--primary)':'var(--text)'}}>{r}</div>

    <Card title={active} extra={<div style={{display:'flex', gap:6}}>

      <Button variant="default" size="sm" icon="download" onClick={()=>exportAs('PDF')}>PDF</Button>
    </div>}>

  </div>;
}

        {key:'id', label:'ID'}, {key:'name', label:'Service'}, {key:'description', label:'Description'}, {key:'owner', label:'Owner'},
        {key:'team', label:'Support Team'}, {key:'sla', label:'SLA'}, {key:'availability', label:'Availability'}, {key:'status', label:'Status', render:r=><StatusBadge status={r.status}/>},
      ]} rows={SERVICES} emptyText="No services configured."/>
    </Card> : <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12}}>
      {Object.entries(CATEGORIES).map(([cat, subs])=>(
        <Card key={cat} title={cat}>
          {subs.map(s=><div key={s} style={{fontSize:12.5, padding:'5px 0', borderBottom:'1px solid var(--border)', color:'var(--text-muted)'}}>{s}</div>)}
        </Card>
      ))}
    </div>}
  </div>;
}
function AdminSLAView(){
  return <Card style={{padding:0}}>
    <DataTable columns={[
      {key:'priority', label:'Priority', render:r=><PriorityBadge priority={r.priority}/>},
      {key:'response', label:'Response SLA'}, {key:'resolution', label:'Resolution SLA'},
    ]} rows={[
      {id:'P1', priority:'P1', response:'30 minutes', resolution:'4 Hours'},
      {id:'P2', priority:'P2', response:'1 Hour', resolution:'8 Hours'},
      {id:'P3', priority:'P3', response:'4 Hours', resolution:'2 Business Days'},
      {id:'P4', priority:'P4', response:'8 Hours', resolution:'5 Business Days'},
    ]} emptyText="No SLA policies."/>
  </Card>;
}
function AdminWorkflowsView(){
  const workflows = [
    {name:'Incident Lifecycle', steps:['New','Assigned','In Progress','Pending User','Pending Vendor','Resolved','Closed']},
    {name:'Service Request Lifecycle', steps:['Request','Approval Required','Approved','Assigned','Fulfillment','Completed','Closed']},
    {name:'Problem Lifecycle', steps:['New','Investigation','Root Cause Identified','Fix Planned','Resolved','Closed']},
    {name:'Normal Change Lifecycle', steps:['Draft','Assessment','Approval','Scheduled','Implementation','Validation','Completed','Closed']},
    {name:'Emergency Change Lifecycle', steps:['Draft','Approval','Implementation','Validation','Completed','Closed']},
  ];
  return <div style={{display:'flex', flexDirection:'column', gap:14}}>
    {workflows.map(w=>(
      <Card key={w.name} title={w.name}>
        <div style={{display:'flex', alignItems:'center', flexWrap:'wrap', gap:6}}>
          {w.steps.map((s,i)=>(<React.Fragment key={s}>
            <span style={{padding:'6px 12px', background:'var(--bg)', border:'1px solid var(--border)', borderRadius:20, fontSize:12}}>{s}</span>
            {i<w.steps.length-1 && <Icon name="chevronRight" size={14} color="var(--text-faint)"/>}
          </React.Fragment>))}
        </div>
      </Card>
    ))}
  </div>;
}
function AdminSettingsView({state}){
  const toast = useToast();
  return <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
    <Card title="General Settings">
      <Field label="Organization Name"><TextInput value="National Iron" onChange={()=>{}}/></Field>
      <Field label="Default Timezone"><Select value="Asia/Riyadh" onChange={()=>{}} options={['Asia/Riyadh','UTC','Asia/Dubai']}/></Field>
      <Field label="Business Hours"><TextInput value="08:00 - 17:00 (Sun-Thu)" onChange={()=>{}}/></Field>
      <Button variant="primary" onClick={()=>toast('Settings saved','success')}>Save Changes</Button>
    </Card>
    <Card title="Business Rules (Active)">
      {[
        'Critical incidents automatically receive P1.', 'P1 tickets have the shortest SLA target.',
        'SLA timer starts when the ticket is created.', 'Pending User pauses the resolution SLA.',
        'Pending Vendor pauses the resolution SLA.', 'Resolved tickets can be reopened by the requester.',
        'Closed tickets cannot be edited except by IT Admin.', 'Change requests require CAB approval before scheduling.',
        'Emergency Changes use an expedited approval workflow.', 'SLA breach automatically generates a notification.',
      ].map((r,i)=><div key={i} style={{display:'flex', gap:8, alignItems:'flex-start', fontSize:12.5, padding:'6px 0', borderBottom:'1px solid var(--border)'}}>
        <span style={{color:'var(--success)', marginTop:2}}><Icon name="check" size={13}/></span>{r}
      </div>)}
    </Card>
    <Card title="Audit Log" style={{gridColumn:'1 / span 2', padding:0}}>
      <DataTable columns={[
        {key:'date', label:'Date/Time', render:r=>fmtDateTime(r.date), sortValue:r=>new Date(r.date)},
        {key:'user', label:'User'}, {key:'action', label:'Action'}, {key:'oldValue', label:'Old Value'}, {key:'newValue', label:'New Value'},
        {key:'relatedId', label:'Related', render:r=><span className="mono" style={{color:'var(--primary)'}}>{r.relatedId}</span>},
      ]} rows={state.auditLog.slice(0,40)} emptyText="No audit entries yet."/>
    </Card>
  </div>;
}
/* ============================= ROOT APP ============================= */
function AppShell(){
  const [state, dispatch] = useReducer(reducer, null, buildInitialDB);
  const [role, setRole] = useState('IT Manager');
  const [view, setView] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(false);
  const [ticketDrawer, setTicketDrawer] = useState(null); // {collection, id}
  const toast = useToast();

  const currentUser = useMemo(()=>{
    const roleUsers = USERS.filter(u=>u.role===role);
    return roleUsers[0] || USERS[0];
  }, [role]);

  useEffect(()=>{
    setView(ROLE_LANDING[role] || 'dashboard');
  }, [role]);

  function onOpenTicket(collection, id){ setTicketDrawer({collection, id}); }
  function handleSetRole(r){ setRole(r); toast('Switched to '+r+' — viewing as '+ (USERS.find(u=>u.role===r)||USERS[0]).name, 'info'); }

  function renderView(){
    switch(view){
      case 'dashboard': return <DashboardView state={state} onOpenTicket={onOpenTicket} setView={setView}/>;
      case 'employee-home': return <EmployeeHomeView state={state} currentUser={currentUser} onOpenTicket={onOpenTicket} setView={setView}/>;
      case 'agent-workspace': return <AgentWorkspaceView state={state} currentUser={currentUser} onOpenTicket={onOpenTicket} setView={setView}/>;
      case 'all-tickets': return <AllTicketsView state={state} onOpenTicket={onOpenTicket} setView={setView}/>;
      case 'my-tickets': return <MyTicketsView state={state} onOpenTicket={onOpenTicket} currentUser={currentUser} setView={setView}/>;
      case 'create-ticket': return <CreateTicketView state={state} dispatch={dispatch} currentUser={currentUser} setView={setView} onOpenTicket={onOpenTicket}/>;
      case 'incidents': return <IncidentsView state={state} onOpenTicket={onOpenTicket} setView={setView} currentUser={currentUser}/>;
      case 'requests': return <RequestsView state={state} onOpenTicket={onOpenTicket} setView={setView} currentUser={currentUser}/>;
      case 'problems': return <ProblemsView state={state} dispatch={dispatch} currentUser={currentUser}/>;
      case 'changes': return <ChangesView state={state} dispatch={dispatch} currentUser={currentUser}/>;
      case 'change-calendar': return <ChangeCalendarView state={state}/>;
      case 'approvals': return <ApprovalsView state={state} dispatch={dispatch} currentUser={currentUser}/>;
      case 'sla': return <SLAView state={state} onOpenTicket={onOpenTicket}/>;
      case 'knowledge': return <KnowledgeBaseView state={state} dispatch={dispatch}/>;
      case 'assets': return <AssetsView state={state} dispatch={dispatch} currentUser={currentUser}/>;
      case 'cis': return <CIsView state={state}/>;
      case 'topology': return <TopologyView state={state} onOpenTicket={onOpenTicket} setView={setView}/>;
      case 'teams': return <TeamsView state={state}/>;
      case 'users': return <UsersView state={state} currentUser={currentUser}/>;
      case 'reports': return <ReportsView state={state}/>;
      case 'analytics': return <AnalyticsView state={state}/>;
      case 'admin-catalog': return <AdminCatalogView state={state}/>;
      case 'admin-sla': return <AdminSLAView/>;
      case 'admin-workflows': return <AdminWorkflowsView/>;
      case 'admin-settings': return <AdminSettingsView state={state}/>;
      default: return <DashboardView state={state} onOpenTicket={onOpenTicket} setView={setView}/>;
    }
  }

  return <div style={{display:'flex', minHeight:'100vh'}}>
    <Sidebar view={view} setView={setView} role={role} collapsed={collapsed}/>
    <div style={{flex:1, minWidth:0, display:'flex', flexDirection:'column'}}>
      <Header role={role} setRole={handleSetRole} currentUser={currentUser} view={view} setView={setView} state={state} dispatch={dispatch} onOpenTicket={onOpenTicket} collapsed={collapsed} setCollapsed={setCollapsed}/>
      <div style={{padding:20, flex:1}}>
        {renderView()}
      </div>
    </div>
    {ticketDrawer && <TicketDetailDrawer collection={ticketDrawer.collection} id={ticketDrawer.id} onClose={()=>setTicketDrawer(null)} state={state} dispatch={dispatch} currentUser={currentUser}/>}
  </div>;
}

function App(){
  return <ToastProvider><AppShell/></ToastProvider>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
