<script type="text/babel" data-presets="env,react" data-type="module">
const {useState,useEffect,useMemo,useReducer,useRef,useContext,createContext,useCallback} = React;

/* ============================= UTILITIES ============================= */
let __seed = 42;
function rnd(){ __seed = (__seed*1103515245+12345) & 0x7fffffff; return __seed/0x7fffffff; }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function pickN(arr,n){ const copy=[...arr]; const out=[]; for(let i=0;i<n && copy.length;i++){ out.push(copy.splice(Math.floor(rnd()*copy.length),1)[0]); } return out; }
function pad(n,len){ return String(n).padStart(len,'0'); }
function daysAgo(d){ const dt = new Date(); dt.setDate(dt.getDate()-d); dt.setHours(Math.floor(rnd()*10)+8, Math.floor(rnd()*60), 0,0); return dt; }
function hoursAgo(h){ const dt = new Date(); dt.setHours(dt.getHours()-h); return dt; }
function fmtDate(d){ if(!d) return '-'; const dt = (d instanceof Date)?d:new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ if(!d) return '-'; const dt = (d instanceof Date)?d:new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function fmtTime(d){ const dt=(d instanceof Date)?d:new Date(d); return dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function classNames(...a){ return a.filter(Boolean).join(' '); }

/* ============================= REFERENCE DATA ============================= */
const DEPARTMENTS = ['IT','Finance','HR','Sales','Procurement','Operations','Production','Warehouse'];

const TEAMS = [
  {id:'TEAM-SVD', name:'IT Service Desk', focus:'Tier 1 intake & triage'},
  {id:'TEAM-SAP', name:'SAP Support', focus:'SAP S/4HANA & Fiori'},
  {id:'TEAM-APP', name:'Applications', focus:'Business applications'},
  {id:'TEAM-INF', name:'Infrastructure', focus:'Servers & data center'},
  {id:'TEAM-NET', name:'Network', focus:'LAN/WAN & connectivity'},
  {id:'TEAM-SEC', name:'Cybersecurity', focus:'Access & security'},
];

const SERVICES = [
  {id:'SVC-01', name:'SAP S/4HANA', description:'Core ERP platform for finance, production and procurement.', owner:'Yousef Al-Harbi', team:'SAP Support', sla:'P2', availability:'99.5%', status:'Operational'},
  {id:'SVC-02', name:'SAP Fiori', description:'Web front end for SAP transactions and approvals.', owner:'Yousef Al-Harbi', team:'SAP Support', sla:'P2', availability:'99.4%', status:'Operational'},
  {id:'SVC-03', name:'Network', description:'Site LAN/WAN connectivity across all National Iron facilities.', owner:'Faisal Al-Otaibi', team:'Network', sla:'P1', availability:'99.9%', status:'Operational'},
  {id:'SVC-04', name:'Internet', description:'Internet access and web filtering.', owner:'Faisal Al-Otaibi', team:'Network', sla:'P2', availability:'99.8%', status:'Operational'},
  {id:'SVC-05', name:'Email', description:'Corporate email and calendaring.', owner:'Huda Al-Zahrani', team:'Applications', sla:'P2', availability:'99.9%', status:'Operational'},
  {id:'SVC-06', name:'Microsoft 365', description:'Office apps, Teams and SharePoint.', owner:'Huda Al-Zahrani', team:'Applications', sla:'P2', availability:'99.9%', status:'Operational'},
  {id:'SVC-07', name:'Printer', description:'Site printing and multi-function devices.', owner:'Omar Nasser', team:'IT Service Desk', sla:'P4', availability:'98.5%', status:'Operational'},
  {id:'SVC-08', name:'Laptop / Desktop', description:'End-user compute hardware.', owner:'Omar Nasser', team:'IT Service Desk', sla:'P3', availability:'99.0%', status:'Operational'},
  {id:'SVC-09', name:'VPN', description:'Remote access to the corporate network.', owner:'Faisal Al-Otaibi', team:'Network', sla:'P2', availability:'99.6%', status:'Degraded'},
  {id:'SVC-10', name:'User Account', description:'Directory accounts and password resets.', owner:'Lina Kassab', team:'Cybersecurity', sla:'P3', availability:'99.9%', status:'Operational'},
  {id:'SVC-11', name:'Access Management', description:'Role and permission provisioning.', owner:'Lina Kassab', team:'Cybersecurity', sla:'P3', availability:'99.9%', status:'Operational'},
  {id:'SVC-12', name:'Applications', description:'Internal line-of-business applications.', owner:'Huda Al-Zahrani', team:'Applications', sla:'P3', availability:'99.5%', status:'Operational'},
  {id:'SVC-13', name:'Infrastructure', description:'Servers, storage and virtualization.', owner:'Tariq Suleiman', team:'Infrastructure', sla:'P1', availability:'99.8%', status:'Operational'},
  {id:'SVC-14', name:'Security', description:'Endpoint protection and threat monitoring.', owner:'Lina Kassab', team:'Cybersecurity', sla:'P1', availability:'99.9%', status:'Operational'},
];

const FIRST_NAMES = ['Ahmed','Mohammed','Khalid','Faisal','Yousef','Omar','Tariq','Saeed','Fahad','Nasser','Abdullah','Bandar','Sultan','Majed','Rashid','Hassan','Ibrahim','Waleed','Salem','Turki'];
const LAST_NAMES = ['Al-Harbi','Al-Otaibi','Al-Zahrani','Al-Ghamdi','Al-Qahtani','Al-Shammari','Al-Dosari','Al-Mutairi','Suleiman','Kassab','Nasser','Al-Balawi','Al-Rashid','Al-Subaie','Al-Amri'];
const FEMALE_FIRST = ['Huda','Lina','Sara','Noura','Reem','Layla','Amal','Dana','Maha','Aisha'];

const ROLES = ['Employee','Service Desk Agent','IT Support','IT Manager','IT Admin'];

function genUsers(){
  const users = [];
  const teamPool = TEAMS.map(t=>t.name);
  // fixed key personas referenced elsewhere
  const seedUsers = [
    {name:'Ahmed Ali', role:'Employee', department:'Production', team:null},
    {name:'Omar Nasser', role:'Service Desk Agent', department:'IT', team:'IT Service Desk'},
    {name:'Yousef Al-Harbi', role:'IT Support', department:'IT', team:'SAP Support'},
    {name:'Faisal Al-Otaibi', role:'IT Support', department:'IT', team:'Network'},
    {name:'Huda Al-Zahrani', role:'IT Support', department:'IT', team:'Applications'},
    {name:'Tariq Suleiman', role:'IT Support', department:'IT', team:'Infrastructure'},
    {name:'Lina Kassab', role:'IT Support', department:'IT', team:'Cybersecurity'},
    {name:'Nasser Al-Ghamdi', role:'IT Manager', department:'IT', team:'IT Service Desk'},
    {name:'Sultan Al-Mutairi', role:'IT Admin', department:'IT', team:'IT Service Desk'},
  ];
  seedUsers.forEach((u,i)=>{
    users.push({id:'USR-'+pad(i+1,3), name:u.name, role:u.role, department:u.department, team:u.team, email:u.name.toLowerCase().replace(/[^a-z]+/g,'.')+'@nationaliron.com', color: pick(['#2B5C8A','#C1622D','#1E8E5A','#7A4FB5','#B9790C'])});
  });
  let n = seedUsers.length;
  const remainingRoles = ['Employee','Employee','Employee','Employee','Employee','Employee','Employee','Employee','Employee','Employee','Employee','Employee','Service Desk Agent','Service Desk Agent','IT Support','IT Support','IT Support'];
  remainingRoles.forEach((role)=>{
    n++;
    const isFemale = rnd()<0.3;
    const fn = isFemale? pick(FEMALE_FIRST): pick(FIRST_NAMES);
    const ln = pick(LAST_NAMES);
    const dept = role==='Employee' ? pick(DEPARTMENTS) : 'IT';
    const team = role==='Employee' ? null : pick(teamPool);
    users.push({id:'USR-'+pad(n,3), name:fn+' '+ln, role, department:dept, team, email:(fn+'.'+ln).toLowerCase().replace(/[^a-z.]+/g,'')+'@nationaliron.com', color: pick(['#2B5C8A','#C1622D','#1E8E5A','#7A4FB5','#B9790C','#3D7A9E'])});
  });
  return users;
}

const USERS = genUsers();
function usersByRole(role){ return USERS.filter(u=>u.role===role); }
function agentsForTeam(teamName){ return USERS.filter(u=>u.team===teamName && u.role!=='Employee'); }
function randomEmployee(){ return pick(usersByRole('Employee')); }
function randomAgent(){ const pool = USERS.filter(u=>u.role==='Service Desk Agent'||u.role==='IT Support'); return pick(pool); }

/* Priority matrix: Impact(1 High,2 Med,3 Low) x Urgency(1 High,2 Med,3 Low) */
const PRIORITY_MATRIX = {
  '1-1':'P1', '1-2':'P1', '1-3':'P2',
  '2-1':'P1', '2-2':'P2', '2-3':'P3',
  '3-1':'P2', '3-2':'P3', '3-3':'P4',
};
function calcPriority(impact, urgency){ return PRIORITY_MATRIX[impact+'-'+urgency] || 'P3'; }
const PRIORITY_LABEL = {P1:'P1 Critical', P2:'P2 High', P3:'P3 Medium', P4:'P4 Low'};
const SLA_HOURS = {P1:4, P2:8, P3:48, P4:120};
const SLA_RESPONSE_HOURS = {P1:0.5, P2:1, P3:4, P4:8};

const CATEGORIES = {
  'SAP': ['Login Failure','Transaction Error','Report Issue','Performance','Access Request'],
  'Network': ['Connectivity Loss','Slow Network','WiFi Issue','VPN Failure','Switch/Port Issue'],
  'Hardware': ['Laptop Issue','Desktop Issue','Printer Issue','Peripheral Fault'],
  'Software': ['Installation Request','Application Crash','Update Required','License Issue'],
  'Security': ['Suspicious Activity','Password Reset','Account Lockout','Phishing Report'],
  'Email': ['Mailbox Full','Delivery Failure','Outlook Sync Issue'],
  'Access': ['New Access Request','Access Revoke','Permission Change'],
  'Applications': ['Bug Report','Feature Not Working','Data Issue'],
};
/* ============================= TIMELINE HELPER ============================= */
function tl(when, text, meta){ return {ts: when, text, meta: meta||null}; }

/* ============================= INCIDENTS ============================= */
const INCIDENT_TITLES = {
  'SAP':['SAP S/4HANA login issue','Unable to post finance document in SAP','SAP Fiori tile not loading','SAP transaction MIGO throwing error','SAP report ZFI_001 returns no data'],
  'Network':['Site network down at Warehouse 3','Intermittent connectivity in Production floor','WiFi drops every few minutes','VPN connection keeps failing','Core switch port down'],
  'Hardware':['Laptop will not power on','Desktop blue screen on startup','Printer jams on every print job','Docking station not detected'],
  'Software':['Application crashes on launch','Outlook freezes when opening attachments','Software license expired warning','Update stuck at 45%'],
  'Security':['Suspicious login attempt detected','Account locked out after failed attempts','Phishing email reported by user','Antivirus alert on workstation'],
  'Email':['Mailbox full, cannot receive email','Emails not syncing on mobile','External emails going to spam'],
  'Applications':['Procurement portal returns error 500','Inventory app not saving records','HR portal timesheet not submitting'],
};
function randCategoryIncident(){ const cats = Object.keys(INCIDENT_TITLES); const cat = pick(cats); const title = pick(INCIDENT_TITLES[cat]); const sub = pick(CATEGORIES[cat]||['General']); return {cat, sub, title}; }

function buildIncidentTimeline(created, status, agentName, teamName){
  const events = [tl(created, 'Incident created', {user:'System'})];
  let t = new Date(created);
  const addMin = (m)=>{ t = new Date(t.getTime()+m*60000); return t; };
  events.push(tl(addMin(2), 'Assigned to ' + teamName, {user:'System'}));
  if(status!=='New'){
    events.push(tl(addMin(8), 'Assigned to ' + agentName, {user:'System'}));
    events.push(tl(addMin(15), agentName + ' started work', {user:agentName}));
  }
  if(['In Progress','Pending User','Pending Vendor','Resolved','Closed'].includes(status)){
    events.push(tl(addMin(20), 'Internal note added', {user:agentName}));
  }
  if(status==='Pending User'){
    events.push(tl(addMin(10), 'Waiting on user for more information', {user:agentName}));
  }
  if(status==='Pending Vendor'){
    events.push(tl(addMin(10), 'Escalated to vendor for support', {user:agentName}));
  }
  if(['Resolved','Closed'].includes(status)){
    events.push(tl(addMin(45), 'Issue resolved', {user:agentName}));
  }
  if(status==='Closed'){
    events.push(tl(addMin(60), 'Ticket closed', {user:agentName}));
  }
  return events;
}

function genIncidents(count){
  const list = [];
  const statuses = ['New','Assigned','In Progress','Pending User','Pending Vendor','Resolved','Closed'];
  for(let i=0;i<count;i++){
    const {cat, sub, title} = randCategoryIncident();
    const impact = 1+Math.floor(rnd()*3);
    const urgency = 1+Math.floor(rnd()*3);
    const priority = calcPriority(impact,urgency);
    let status = pick(statuses);
    const done = ['Resolved','Closed'].includes(status);
    // open work sits inside (or just past) its SLA window; closed work is historical
    const ageH = done ? (24 + rnd()*24*22) : (rnd()*SLA_HOURS[priority]*1.15);
    const created = new Date(Date.now() - ageH*3600000);
    const caller = randomEmployee();
    const service = pick(SERVICES.filter(s=>true));
    const team = TEAMS.find(t=>t.name===service.team) || pick(TEAMS);
    const agent = pick(agentsForTeam(team.name)) || randomAgent();
    const num = 125+i;
    const id = 'INC-2026-' + pad(num,5);
    list.push({
      id, type:'Incident',
      caller: caller.name, callerId: caller.id, department: caller.department,
      service: service.name, category: cat, subcategory: sub,
      shortDescription: title, description: title + '. Reported by ' + caller.name + ' from ' + caller.department + ' department.',
      impact, urgency, priority,
      assignGroup: team.name, assignedAgent: agent ? agent.name : 'Unassigned',
      attachments: rnd()<0.3 ? ['screenshot.png'] : [],
      createdDate: created,
      status,
      resolvedAt: done
        ? new Date(created.getTime() + SLA_HOURS[priority]*3600000*(i % 7 === 0 ? (1.05+rnd()*0.6) : (0.2+rnd()*0.65)))
        : null,
      comments: status!=='New' ? [{user:caller.name, text:'Please let me know status update.', ts: new Date(created.getTime()+3600000)}] : [],
      workNotes: status!=='New' ? [{user: agent? agent.name:'Agent', text:'Investigating root cause.', ts: new Date(created.getTime()+5400000)}] : [],
      timeline: buildIncidentTimeline(created, status, agent?agent.name:'Unassigned', team.name),
      problemId: null,
      slaResponseHours: SLA_RESPONSE_HOURS[priority],
      slaResolutionHours: SLA_HOURS[priority],
    });
  }
  return list;
}

/* ============================= SERVICE REQUESTS ============================= */
const REQUEST_CATALOG = [
  {name:'New Laptop', service:'Laptop / Desktop', approval:true},
  {name:'New User Account', service:'User Account', approval:true},
  {name:'Software Installation', service:'Applications', approval:true},
  {name:'SAP Access', service:'SAP S/4HANA', approval:true},
  {name:'VPN Access', service:'VPN', approval:true},
  {name:'Email Account', service:'Email', approval:false},
  {name:'Printer Access', service:'Printer', approval:false},
  {name:'Folder Access', service:'Access Management', approval:true},
  {name:'System Permission', service:'Access Management', approval:true},
];
function buildRequestTimeline(created, status, agentName){
  const events = [tl(created,'Service request submitted',{user:'System'})];
  let t = new Date(created);
  const addMin=(m)=>{t=new Date(t.getTime()+m*60000);return t;};
  if(['Approval Required','Approved','Assigned','Fulfillment','Completed','Closed'].includes(status)) events.push(tl(addMin(5),'Sent for approval',{user:'System'}));
  if(['Approved','Assigned','Fulfillment','Completed','Closed'].includes(status)) events.push(tl(addMin(120),'Request approved',{user:'Manager'}));
  if(['Assigned','Fulfillment','Completed','Closed'].includes(status)) events.push(tl(addMin(20),'Assigned to '+agentName,{user:'System'}));
  if(['Fulfillment','Completed','Closed'].includes(status)) events.push(tl(addMin(30),'Fulfillment in progress',{user:agentName}));
  if(['Completed','Closed'].includes(status)) events.push(tl(addMin(90),'Request completed',{user:agentName}));
  if(status==='Closed') events.push(tl(addMin(30),'Request closed',{user:agentName}));
  return events;
}
function genRequests(count){
  const list=[];
  const statuses=['Request','Approval Required','Approved','Assigned','Fulfillment','Completed','Closed'];
  for(let i=0;i<count;i++){
    const cat = pick(REQUEST_CATALOG);
    const requester = randomEmployee();
    let status = cat.approval ? pick(statuses) : pick(statuses.filter(s=>s!=='Approval Required'));
    const doneR = ['Completed','Closed'].includes(status);
    const ageHR = doneR ? (24 + rnd()*24*20) : (rnd()*52);
    const created = new Date(Date.now() - ageHR*3600000);
    const service = SERVICES.find(s=>s.name===cat.service) || pick(SERVICES);
    const team = TEAMS.find(t=>t.name===service.team) || pick(TEAMS);
    const agent = pick(agentsForTeam(team.name)) || randomAgent();
    const id = 'REQ-2026-' + pad(300+i,5);
    list.push({
      id, type:'Request',
      requester: requester.name, requesterId: requester.id, department: requester.department,
      catalogItem: cat.name, service: service.name,
      description: cat.name + ' requested by ' + requester.name + ' (' + requester.department + ').',
      approvalRequired: cat.approval,
      priority: pick(['P3','P4']),
      assignGroup: team.name, assignedAgent: agent? agent.name : 'Unassigned',
      status, createdDate: created,
      resolvedAt: doneR
        ? new Date(created.getTime() + 48*3600000*(i % 8 === 0 ? (1.05+rnd()*0.5) : (0.25+rnd()*0.6)))
        : null,
      comments: [], workNotes: status!=='Request' ? [{user:agent?agent.name:'Agent', text:'Processing request.', ts:new Date(created.getTime()+5400000)}] : [],
      timeline: buildRequestTimeline(created, status, agent?agent.name:'Unassigned'),
      slaResolutionHours: 48,
    });
  }
  return list;
}
/* ============================= PROBLEMS ============================= */
const PROBLEM_TITLES = [
  {title:'Repeated SAP Login Failure', category:'SAP'},
  {title:'Recurring VPN Disconnections', category:'Network'},
  {title:'Printer offline across floor 2', category:'Hardware'},
  {title:'Outlook crashes on large attachments', category:'Software'},
  {title:'Intermittent Wi-Fi drops in Warehouse', category:'Network'},
  {title:'SAP Fiori tiles fail to render', category:'SAP'},
  {title:'Laptop battery drains rapidly (batch)', category:'Hardware'},
  {title:'Procurement portal timeout under load', category:'Applications'},
  {title:'Email delivery delays to external domains', category:'Email'},
  {title:'Account lockouts after password policy change', category:'Security'},
  {title:'Core switch packet loss at Plant 1', category:'Network'},
  {title:'SAP report performance degradation', category:'SAP'},
];
function genProblems(count, incidents){
  const list=[];
  const statuses=['New','Investigation','Root Cause Identified','Fix Planned','Resolved','Closed'];
  for(let i=0;i<count;i++){
    const p = PROBLEM_TITLES[i % PROBLEM_TITLES.length];
    const daysBack = 5+Math.floor(rnd()*25);
    const created = daysAgo(daysBack);
    const status = pick(statuses);
    const team = pick(TEAMS);
    const owner = pick(agentsForTeam(team.name)) || randomAgent();
    const related = pickN(incidents.filter(inc=>inc.category===p.category), Math.min(4, 2+Math.floor(rnd()*3))).map(inc=>inc.id);
    const id = 'PRB-' + pad(23+i,5);
    list.push({
      id, title:p.title, description: p.title + ' has been reported across multiple incidents and requires root cause analysis.',
      relatedIncidents: related,
      rootCause: status==='Root Cause Identified'||status==='Fix Planned'||status==='Resolved'||status==='Closed' ? 'Configuration drift identified after last patch cycle.' : '',
      workaround: status!=='New' ? 'Restart the affected service to temporarily restore access.' : '',
      permanentFix: status==='Resolved'||status==='Closed' ? 'Applied permanent configuration fix and validated with support team.' : '',
      owner: owner.name, team: team.name,
      priority: pick(['P1','P2','P3']),
      status, createdDate: created,
      timeline: [tl(created,'Problem record created',{user:owner.name})],
    });
  }
  return list;
}

/* ============================= CHANGES ============================= */
const CHANGE_TITLES = [
  {title:'Upgrade SAP S/4HANA to latest patch level', type:'Normal'},
  {title:'Replace core switch at Plant 1', type:'Normal'},
  {title:'Apply emergency security patch to VPN gateway', type:'Emergency'},
  {title:'Standard: Add new user mailbox', type:'Standard'},
  {title:'Migrate file server to new storage array', type:'Normal'},
  {title:'Standard: Printer driver rollout', type:'Standard'},
  {title:'Emergency firewall rule change - active threat', type:'Emergency'},
  {title:'Upgrade Wi-Fi access points in Warehouse', type:'Normal'},
  {title:'Standard: Software license renewal deployment', type:'Standard'},
  {title:'Network segmentation for Production floor', type:'Normal'},

function genCIs(assets, incidents, problems, changes){
  return CI_GRAPH.map(ci=>{
    const matching = incidents.filter(i=>ci.services.includes(i.service));
    const related = pickN(matching.map(i=>i.id), Math.min(5, matching.length));
    return {
      ...ci,
      relatedServices: ci.services,
      relatedIncidents: related,
      relatedProblems: pickN(problems.map(p=>p.id), Math.min(2, problems.length)),
      relatedChanges: pickN(changes.map(c=>c.id), Math.min(2, changes.length)),
    };
  });
}
/* Upstream impact: which CIs and business services break if this one fails. */
function ciImpact(cis, id){
  const seen = new Set(); const out = [];
  const walk = (cur)=>{
    cis.filter(c=>c.dependsOn.includes(cur)).forEach(d=>{
      if(seen.has(d.id)) return;
      seen.add(d.id); out.push(d); walk(d.id);
    });
  };
  walk(id);
  return out;
}

/* ============================= SLA ENGINE ============================= */
function slaInfo(ticket){
  const created = new Date(ticket.createdDate);
  const isDone = ['Resolved','Closed','Completed'].includes(ticket.status);
  // the clock stops when the ticket is resolved, not at the current moment
  const stop = (isDone && ticket.resolvedAt) ? new Date(ticket.resolvedAt) : new Date();
  const resHours = ticket.slaResolutionHours || SLA_HOURS[ticket.priority] || 48;
  const elapsedH = (stop-created)/3600000;
  const paused = ['Pending User','Pending Vendor'].includes(ticket.status);
  const pct = clamp(elapsedH/resHours,0,1.4);
  let state = 'On Track';
  if(isDone){ state = pct<=1 ? 'Met' : 'Breached'; }
  else if(paused){ state = 'Paused'; }
  else if(pct>=1) state='Breached';
  else if(pct>=0.75) state='At Risk';
  const remainingH = resHours - elapsedH;
  return { target: resHours, elapsedH, remainingH, pct: Math.min(pct,1), state };
}
function slaColor(state){
  if(state==='Breached') return {c:'var(--danger)', bg:'var(--danger-bg)'};
  if(state==='At Risk') return {c:'var(--warning)', bg:'var(--warning-bg)'};
  if(state==='Paused') return {c:'var(--text-muted)', bg:'#EEF0F3'};
  if(state==='Met') return {c:'var(--success)', bg:'var(--success-bg)'};
  return {c:'var(--success)', bg:'var(--success-bg)'};
}

function reducer(state, action){
  switch(action.type){

      const inc = action.payload;
      const created = new Date();
      const newInc = {
        ...inc,

        type:'Incident', status:'New', createdDate: created,
        comments:[], workNotes:[], attachments:[], resolvedAt:null,
        timeline:[tl(created,'Incident created',{user:inc.caller})],
        problemId:null,
        slaResponseHours: SLA_RESPONSE_HOURS[inc.priority], slaResolutionHours: SLA_HOURS[inc.priority],
      };
      return {...state, incidents:[newInc, ...state.incidents], notifications:[{id:uid('NTF'),type:'Ticket Assigned', message:newInc.id+' created and routed to '+newInc.assignGroup, date:created, read:false, relatedId:newInc.id}, ...state.notifications], auditLog:[{id:uid('AUD'),user:inc.caller,action:'Incident created',date:created,oldValue:'-',newValue:newInc.id,relatedId:newInc.id}, ...state.auditLog], _lastCreated:newInc.id };
    }
    case 'CREATE_REQUEST': {
      const req = action.payload;
      const created = new Date();
      const newReq = {
        ...req, id:'REQ-2026-'+pad(300+state.requests.length,5), type:'Request', status: req.approvalRequired ? 'Approval Required' : 'Assigned', createdDate: created,
        comments:[], workNotes:[], resolvedAt:null, timeline:[tl(created,'Service request submitted',{user:req.requester})],
        slaResolutionHours:48,
      };
      let approvals = state.approvals;
      if(req.approvalRequired){
        const approver = pick(usersByRole('IT Manager'));
        approvals = [{id:'APR-'+newReq.id, relatedType:'Request', relatedId:newReq.id, title:newReq.catalogItem, requester:newReq.requester, approver:approver.name, reason:'Approval required for '+newReq.catalogItem+'.', date:created, status:'Pending'}, ...approvals];
      }
      return {...state, requests:[newReq, ...state.requests], approvals, notifications:[{id:uid('NTF'),type:'Ticket Assigned',message:newReq.id+' submitted',date:created,read:false,relatedId:newReq.id}, ...state.notifications], _lastCreated:newReq.id };
    }
    case 'UPDATE_TICKET': {
      const {collection, id, changes, note, user} = action.payload;
      const list = state[collection].map(t=>{
        if(t.id!==id) return t;
        const updated = {...t, ...changes};
        if(['Resolved','Closed','Completed'].includes(updated.status) && !updated.resolvedAt) updated.resolvedAt = new Date();
        if(!['Resolved','Closed','Completed'].includes(updated.status)) updated.resolvedAt = null; // reopened
        const events = [...t.timeline];
        const now = new Date();
        if(note) events.push(tl(now, note, {user}));
        updated.timeline = events;
        return updated;
      });
      const auditEntries = Object.keys(changes).map(k=>({id:uid('AUD'), user: user||'System', action:'Updated '+k, date:new Date(), oldValue:String(state[collection].find(t=>t.id===id)[k]), newValue:String(changes[k]), relatedId:id}));
      return {...state, [collection]: list, auditLog:[...auditEntries, ...state.auditLog]};
    }
    case 'ADD_COMMENT': {
      const {collection, id, text, user} = action.payload;
      const now = new Date();
      const list = state[collection].map(t=> t.id===id ? {...t, comments:[...t.comments,{user,text,ts:now}], timeline:[...t.timeline, tl(now,'Comment added by '+user,{user})]} : t);
      return {...state, [collection]:list};
    }
    case 'ADD_WORKNOTE': {
      const {collection, id, text, user} = action.payload;
      const now = new Date();
      const list = state[collection].map(t=> t.id===id ? {...t, workNotes:[...t.workNotes,{user,text,ts:now}], timeline:[...t.timeline, tl(now,'Work note added',{user})]} : t);
      return {...state, [collection]:list};
    }
    case 'DECIDE_APPROVAL': {
      const {id, decision, actor} = action.payload;
      const now = new Date();
      const approvals = state.approvals.map(a=> a.id===id ? {...a, status: decision} : a);
      const target = state.approvals.find(a=>a.id===id);
      let requests = state.requests, changes = state.changes, notifications = state.notifications;
      if(target){
        if(target.relatedType==='Request'){
          requests = state.requests.map(r=> r.id===target.relatedId ? {...r, status: decision==='Approved' ? 'Approved' : 'Closed', timeline:[...r.timeline, tl(now, decision+' by '+actor, {user:actor})]} : r);
          notifications = [{id:uid('NTF'), type: decision==='Approved'?'Change Approved':'Change Rejected', message: target.relatedId+' '+decision.toLowerCase()+' by '+actor, date:now, read:false, relatedId:target.relatedId}, ...notifications];
        } else if(target.relatedType==='Change'){
          changes = state.changes.map(c=> c.id===target.relatedId ? {...c, status: decision==='Approved' ? 'Scheduled' : 'Draft', timeline:[...c.timeline, tl(now, decision+' by '+actor, {user:actor})]} : c);
          notifications = [{id:uid('NTF'), type: decision==='Approved'?'Change Approved':'Change Rejected', message: target.relatedId+' '+decision.toLowerCase()+' by '+actor, date:now, read:false, relatedId:target.relatedId}, ...notifications];
        }
      }
      return {...state, approvals, requests, changes, notifications, auditLog:[{id:uid('AUD'),user:actor,action:'Approval '+decision,date:now,oldValue:'Pending',newValue:decision,relatedId: target?target.relatedId:id}, ...state.auditLog]};
    }
    case 'CREATE_PROBLEM': {
      const p = action.payload;
      const now = new Date();
      const newP = {...p, id:'PRB-'+pad(23+state.problems.length,5), status:'New', createdDate: now, timeline:[tl(now,'Problem record created',{user:p.owner})]};
      let incidents = state.incidents;
      if(p.relatedIncidents && p.relatedIncidents.length){
        incidents = state.incidents.map(inc=> p.relatedIncidents.includes(inc.id) ? {...inc, problemId:newP.id} : inc);
      }
      return {...state, problems:[newP, ...state.problems], incidents, _lastCreated:newP.id};
    }
    case 'CREATE_CHANGE': {
      const c = action.payload;
      const now = new Date();
      const newC = {...c, id:'CHG-2026-'+pad(400+state.changes.length,5), status:'Draft', createdDate:now, timeline:[tl(now,'Change request created',{user:c.owner})]};
      let approvals = state.approvals;
      return {...state, changes:[newC, ...state.changes], _lastCreated:newC.id};
    }
    case 'SUBMIT_CHANGE_APPROVAL': {
      const {id, actor} = action.payload;
      const now = new Date();
      const changes = state.changes.map(c=> c.id===id ? {...c, status:'Approval', timeline:[...c.timeline, tl(now,'Submitted for CAB approval',{user:actor})]} : c);
      const c = state.changes.find(c=>c.id===id);
      const approver = pick(usersByRole('IT Manager'));
      const approvals = [{id:'APR-'+id+'-'+Date.now(), relatedType:'Change', relatedId:id, title:c.title, requester:c.owner, approver:approver.name, reason:'CAB approval required for '+c.type.toLowerCase()+' change.', date:now, status:'Pending'}, ...state.approvals];
      return {...state, changes, approvals};
    }
    case 'MARK_NOTIFICATIONS_READ': {
      return {...state, notifications: state.notifications.map(n=>({...n, read:true}))};
    }
    case 'CREATE_ASSET': {
      const a = action.payload;
      const newA = {...a, id:'AST-'+pad(1000+state.assets.length,4)};
      return {...state, assets:[newA, ...state.assets]};
    }
    case 'KB_FEEDBACK': {
      const {id, helpful} = action.payload;
      const kb = state.kb.map(k=> k.id===id ? {...k, helpfulYes: k.helpfulYes+(helpful?1:0), helpfulNo:k.helpfulNo+(helpful?0:1)} : k);
      return {...state, kb};
    }
    default: return state;
  }
}

/* Toast system */
const ToastCtx = createContext(null);
function ToastProvider({children}){
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, tone='success')=>{
    const id = Math.random().toString(36).slice(2);
    setToasts(t=>[...t, {id, message, tone}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3800);
  },[]);
  return <ToastCtx.Provider value={push}>
    {children}
    <div style={{position:'fixed', top:16, right:16, zIndex:400, display:'flex', flexDirection:'column', gap:8}}>
      {toasts.map(t=>{
        const tone = {success:{c:'var(--success)',icon:'check'}, error:{c:'var(--danger)',icon:'alertTriangle'}, info:{c:'var(--primary)',icon:'info'}}[t.tone] || {c:'var(--success)',icon:'check'};
        return <div key={t.id} style={{animation:'toastIn .15s ease', background:'#fff', border:'1px solid var(--border)', borderLeft:'3px solid '+tone.c, borderRadius:'var(--radius-sm)', boxShadow:'var(--shadow-md)', padding:'10px 14px', minWidth:260, maxWidth:360, display:'flex', gap:10, alignItems:'center', fontSize:13}}>
          <span style={{color:tone.c}}><Icon name={tone.icon} size={16}/></span>
          <span>{t.message}</span>
        </div>;
      })}
    </div>
  </ToastCtx.Provider>;
}
function useToast(){ return useContext(ToastCtx); }

/* Generic DataTable */
function DataTable({columns, rows, onRowClick, emptyText='No records found.', rowKey}){
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState(1);
  const sorted = useMemo(()=>{
    if(!sortCol) return rows;
    const col = columns.find(c=>c.key===sortCol);
    return [...rows].sort((a,b)=>{
      const va = col.sortValue ? col.sortValue(a) : a[sortCol];
      const vb = col.sortValue ? col.sortValue(b) : b[sortCol];
      if(va<vb) return -1*sortDir; if(va>vb) return 1*sortDir; return 0;
    });
  },[rows, sortCol, sortDir, columns]);
  if(rows.length===0){
    return <div style={{padding:'48px 20px', textAlign:'center', color:'var(--text-muted)'}}>
      <div style={{marginBottom:8, display:'flex', justifyContent:'center', color:'var(--text-faint)'}}><Icon name="filter" size={28}/></div>
      {emptyText}
    </div>;
  }
  return <div className="scrollx">
    <table>
      <thead>
        <tr style={{borderBottom:'1px solid var(--border)'}}>
          {columns.map(c=> <th key={c.key} onClick={()=> c.sortable!==false && (sortCol===c.key ? setSortDir(d=>-d) : (setSortCol(c.key), setSortDir(1)))}
            style={{textAlign:c.align||'left', padding:'9px 14px', fontSize:11, fontWeight:700, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:.3, cursor:c.sortable===false?'default':'pointer', whiteSpace:'nowrap'}}>
            {c.label}{sortCol===c.key ? (sortDir===1?' ▲':' ▼') : ''}
          </th>)}
        </tr>
      </thead>
      <tbody>
        {sorted.map((row)=>(
          <tr key={rowKey?rowKey(row):row.id} onClick={()=>onRowClick&&onRowClick(row)} style={{borderBottom:'1px solid var(--border)', cursor:onRowClick?'pointer':'default'}}
            onMouseEnter={e=>e.currentTarget.style.background='#F7F8FA'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            {columns.map(c=> <td key={c.key} style={{padding:'10px 14px', fontSize:13, textAlign:c.align||'left', color:'var(--text)'}}>{c.render? c.render(row) : row[c.key]}</td>)}
          </tr>
        ))}
      </tbody>
    </table>
  </div>;
}

/* Chart.js wrapper */
function ChartCanvas({type, data, options, height=220}){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current.getContext('2d'), {type, data, options: {responsive:true, maintainAspectRatio:false, ...options}});
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), type]);
  return <div style={{height}}><canvas ref={ref}/></div>;
}

/* ============================= GLOBAL SEARCH ============================= */
function globalSearch(state, query){
  if(!query || query.trim().length<1) return [];
  const q = query.toLowerCase();
  const results = [];
  const push = (type, id, title, status, owner, updated) => results.push({type,id,title,status,owner,updated});
  state.incidents.forEach(i=>{ if(i.id.toLowerCase().includes(q) || i.shortDescription.toLowerCase().includes(q) || i.caller.toLowerCase().includes(q)) push('Incident', i.id, i.shortDescription, i.status, i.assignedAgent, i.createdDate); });
  state.requests.forEach(r=>{ if(r.id.toLowerCase().includes(q) || r.catalogItem.toLowerCase().includes(q) || r.requester.toLowerCase().includes(q)) push('Request', r.id, r.catalogItem, r.status, r.assignedAgent, r.createdDate); });
  state.problems.forEach(p=>{ if(p.id.toLowerCase().includes(q) || p.title.toLowerCase().includes(q)) push('Problem', p.id, p.title, p.status, p.owner, p.createdDate); });
  state.changes.forEach(c=>{ if(c.id.toLowerCase().includes(q) || c.title.toLowerCase().includes(q)) push('Change', c.id, c.title, c.status, c.owner, c.createdDate); });
  state.users.forEach(u=>{ if(u.name.toLowerCase().includes(q) || u.id.toLowerCase().includes(q)) push('User', u.id, u.name, u.role, u.department, null); });
  state.assets.forEach(a=>{ if(a.id.toLowerCase().includes(q) || a.name.toLowerCase().includes(q)) push('Asset', a.id, a.name, a.status, a.assignedUser, a.purchaseDate); });
  state.kb.forEach(k=>{ if(k.title.toLowerCase().includes(q) || k.category.toLowerCase().includes(q)) push('Knowledge Article', k.id, k.title, 'Published', k.category, k.lastUpdated); });
  return results.slice(0,20);
}

function TicketDetailDrawer({collection, id, onClose, state, dispatch, currentUser}){
  const toast = useToast();
  const [commentText, setCommentText] = useState('');
  const [noteText, setNoteText] = useState('');
  const [tab, setTab] = useState('Details');
  const ticket = state[collection].find(t=>t.id===id);
  if(!ticket) return null;
  const isIncident = collection==='incidents';
  const statusFlow = isIncident
    ? ['New','Assigned','In Progress','Pending User','Pending Vendor','Resolved','Closed']
    : ['Request','Approval Required','Approved','Assigned','Fulfillment','Completed','Closed'];
  const agentOptions = agentsForTeam(ticket.assignGroup).map(a=>a.name);
  const canEdit = ticket.status!=='Closed' || currentUser.role==='IT Admin';

  function updateField(field, value, note){
    dispatch({type:'UPDATE_TICKET', payload:{collection, id, changes:{[field]:value}, note, user:currentUser.name}});
  }
  function changeStatus(newStatus){
    updateField('status', newStatus, 'Status changed to '+newStatus);
    toast(ticket.id+' status updated to '+newStatus, 'success');
  }
  function assignAgent(name){
    updateField('assignedAgent', name, 'Reassigned to '+name);
    toast(ticket.id+' assigned to '+name, 'success');
  }
  function submitComment(){
    if(!commentText.trim()) return;
    dispatch({type:'ADD_COMMENT', payload:{collection, id, text:commentText, user:currentUser.name}});
    setCommentText(''); toast('Comment added', 'success');
  }
  function submitNote(){
    if(!noteText.trim()) return;
    dispatch({type:'ADD_WORKNOTE', payload:{collection, id, text:noteText, user:currentUser.name}});
    setNoteText(''); toast('Work note added', 'success');
  }
  const info = slaInfo(ticket);
  const col = slaColor(info.state);

  return <Drawer title={ticket.id} subtitle={ticket.shortDescription || ticket.catalogItem} onClose={onClose}
    headerExtra={<PriorityBadge priority={ticket.priority}/>}>
    <div style={{display:'grid', gridTemplateColumns:'1.6fr 1fr', gap:16}}>

            <div><div style={{color:'var(--text-faint)', fontSize:11}}>Urgency</div><div style={{fontWeight:600}}>{ticket.urgency} - {['','High','Medium','Low'][ticket.urgency]}</div></div></>}

          <div style={{maxHeight:220, overflowY:'auto', marginBottom:10}}>

        <Card title="SLA" style={{marginBottom:14}}>
          <div style={{display:'flex', justifyContent:'space-between', fontSize:12.5, marginBottom:6}}>
            <span style={{fontWeight:700, color:col.c}}>{info.state}</span>

          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginTop:12, fontSize:11.5}}>

            <div><div style={{color:'var(--text-faint)'}}>Remaining</div><div className="mono" style={{fontWeight:600, color:col.c}}>{Math.round(info.remainingH)}h</div></div>
          </div>
        </Card>
        {canEdit && <Card title="Actions" style={{marginBottom:14}}>
          <Field label="Status"><Select value={ticket.status} onChange={changeStatus} options={statusFlow}/></Field>
          {currentUser.role!=='Employee' && <Field label="Assigned Agent"><Select value={ticket.assignedAgent} onChange={assignAgent} options={agentOptions.length?agentOptions:[ticket.assignedAgent]}/></Field>}
          {isIncident && currentUser.role!=='Employee' && <Field label="Priority">

            {ticket.status==='Closed' && currentUser.role==='Employee' && <Button variant="default" icon="refresh" onClick={()=>changeStatus(isIncident?'Pending User':'Fulfillment')}>Reopen</Button>}

        {!isIncident && ticket.approvalRequired && <Card title="Approval">
          <div style={{fontSize:12.5, color:'var(--text-muted)'}}>This request requires manager and IT approval before fulfillment.</div>
        </Card>}
      </div>
    </div>
  </Drawer>;
}

function CreateTicketView({state, dispatch, currentUser, setView, onOpenTicket}){
  const [kind, setKind] = useState('Incident');
  const toast = useToast();
  const [form, setForm] = useState({service: SERVICES[0].name, category:'SAP', subcategory:CATEGORIES['SAP'][0], shortDescription:'', description:'', impact:2, urgency:2, catalogItem: REQUEST_CATALOG[0].name});
  const set = (k,v)=> setForm(f=>({...f,[k]:v}));
  const priority = calcPriority(form.impact, form.urgency);

  function submitIncident(){
    if(!form.shortDescription.trim()){ toast('Please enter a short description', 'error'); return; }
    const service = SERVICES.find(s=>s.name===form.service);
    const team = TEAMS.find(t=>t.name===service.team);
    const agent = pick(agentsForTeam(team.name));
    dispatch({type:'CREATE_INCIDENT', payload:{
      caller: currentUser.name, department: currentUser.department, service: form.service, category: form.category, subcategory: form.subcategory,
      shortDescription: form.shortDescription, description: form.description || form.shortDescription,
      impact: form.impact, urgency: form.urgency, priority, assignGroup: team.name, assignedAgent: agent?agent.name:'Unassigned',
    }});
    toast('Incident created: '+state._lastCreated || 'Incident created', 'success');
    setTimeout(()=>setView('all-tickets'), 400);
  }
  function submitRequest(){
    const cat = REQUEST_CATALOG.find(c=>c.name===form.catalogItem);
    const service = SERVICES.find(s=>s.name===cat.service) || SERVICES[0];
    const team = TEAMS.find(t=>t.name===service.team) || TEAMS[0];
    const agent = pick(agentsForTeam(team.name));
    dispatch({type:'CREATE_REQUEST', payload:{
      requester: currentUser.name, department: currentUser.department, catalogItem: form.catalogItem, service: service.name,
      description: form.description || (form.catalogItem + ' requested by ' + currentUser.name), approvalRequired: cat.approval,
      assignGroup: team.name, assignedAgent: agent?agent.name:'Unassigned', priority:'P3',
    }});
    toast('Service request submitted', 'success');
    setTimeout(()=>setView('all-tickets'), 400);
  }

  return <div style={{maxWidth:720}}>
    <Tabs tabs={['Incident','Service Request']} active={kind==='Incident'?'Incident':'Service Request'} onChange={t=>setKind(t==='Incident'?'Incident':'Request')}/>
    {kind==='Incident' ? <Card title="Report an Issue">
      <div style={{fontSize:12.5, color:'var(--text-muted)', marginBottom:14}}>Use this form when something is broken or not working as expected.</div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
        <Field label="Service" required><Select value={form.service} onChange={v=>set('service',v)} options={SERVICES.map(s=>s.name)}/></Field>
        <Field label="Category" required><Select value={form.category} onChange={v=>{set('category',v); set('subcategory', CATEGORIES[v][0]);}} options={Object.keys(CATEGORIES)}/></Field>
        <Field label="Subcategory"><Select value={form.subcategory} onChange={v=>set('subcategory',v)} options={CATEGORIES[form.category]}/></Field>
        <Field label="Department"><TextInput value={currentUser.department} onChange={()=>{}} /></Field>
      </div>
      <Field label="Short Description" required><TextInput value={form.shortDescription} onChange={v=>set('shortDescription',v)} placeholder="e.g. SAP S/4HANA login issue"/></Field>
      <Field label="Description"><TextArea value={form.description} onChange={v=>set('description',v)} rows={4} placeholder="Provide as much detail as possible..."/></Field>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
        <Field label="Impact" required><Select value={form.impact} onChange={v=>set('impact',Number(v))} options={[{value:1,label:'1 - High'},{value:2,label:'2 - Medium'},{value:3,label:'3 - Low'}]}/></Field>
        <Field label="Urgency" required><Select value={form.urgency} onChange={v=>set('urgency',Number(v))} options={[{value:1,label:'1 - High'},{value:2,label:'2 - Medium'},{value:3,label:'3 - Low'}]}/></Field>
      </div>
      <div style={{display:'flex', alignItems:'center', gap:10, background:'var(--bg)', padding:'10px 14px', borderRadius:'var(--radius-sm)', marginBottom:16}}>
        <span style={{fontSize:12.5, color:'var(--text-muted)'}}>Calculated priority:</span><PriorityBadge priority={priority}/>
        <span style={{fontSize:11.5, color:'var(--text-faint)'}}>SLA target: {SLA_HOURS[priority]}h resolution</span>
      </div>
      <Button variant="primary" icon="plus" onClick={submitIncident}>Submit Incident</Button>
    </Card> : <Card title="Request a Service">
      <div style={{fontSize:12.5, color:'var(--text-muted)', marginBottom:14}}>Use this form to request hardware, software, or access.</div>
      <Field label="Request Type" required><Select value={form.catalogItem} onChange={v=>set('catalogItem',v)} options={REQUEST_CATALOG.map(c=>c.name)}/></Field>
      <Field label="Description"><TextArea value={form.description} onChange={v=>set('description',v)} rows={4} placeholder="Business justification or details..."/></Field>
      <div style={{fontSize:11.5, color:'var(--text-faint)', marginBottom:16}}>
        {REQUEST_CATALOG.find(c=>c.name===form.catalogItem).approval ? 'This request requires manager approval before fulfillment.' : 'This request does not require approval and will route directly for fulfillment.'}
      </div>
      <Button variant="primary" icon="plus" onClick={submitRequest}>Submit Request</Button>
    </Card>}
  </div>;
}
/* ============================= DASHBOARD ============================= */
function DashboardView({state, onOpenTicket, setView}){
  const [range, setRange] = useState('30 Days');
  const incidents = state.incidents, requests = state.requests;
  const allTickets = [...incidents, ...requests];
  const openTickets = allTickets.filter(t=>!['Resolved','Closed','Completed'].includes(t.status));
  const critical = incidents.filter(i=>i.priority==='P1' && !['Resolved','Closed'].includes(i.status));
  const breached = allTickets.filter(t=> slaInfo(t).state==='Breached' && !['Resolved','Closed','Completed'].includes(t.status));
  const atRisk = allTickets.filter(t=> slaInfo(t).state==='At Risk');
  const pendingApprovals = state.approvals.filter(a=>a.status==='Pending');
  const openProblems = state.problems.filter(p=>!['Resolved','Closed'].includes(p.status));
  const scheduledChanges = state.changes.filter(c=>['Scheduled','Approval','Implementation'].includes(c.status));

  const trendData = useMemo(()=>{
    const days = 14; const labels=[]; const created=[]; const resolvedArr=[];
    for(let i=days-1;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
      labels.push(d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}));
      const dayCount = allTickets.filter(t=>{ const c = new Date(t.createdDate); return c.toDateString()===d.toDateString(); }).length;
      created.push(dayCount);
      const resCount = allTickets.filter(t=>['Resolved','Closed','Completed'].includes(t.status) && new Date(t.createdDate).toDateString()===d.toDateString()).length;
      resolvedArr.push(resCount);
    }
    return {labels, created, resolvedArr};
  },[allTickets]);

  const byPriority = ['P1','P2','P3','P4'].map(p=>incidents.filter(i=>i.priority===p).length);
  const byDept = DEPARTMENTS.map(d=>allTickets.filter(t=>t.department===d).length);
  const byTeam = TEAMS.map(t=>allTickets.filter(x=>x.assignGroup===t.name).length);
  const slaCompliant = allTickets.filter(t=>['Resolved','Closed','Completed'].includes(t.status) && slaInfo(t).state==='Met').length;
  const slaTotalClosed = allTickets.filter(t=>['Resolved','Closed','Completed'].includes(t.status)).length;
  const slaPct = slaTotalClosed ? Math.round(100*slaCompliant/slaTotalClosed) : 100;

  return <div>
    <FilterBar>
      <Select value={range} onChange={setRange} options={['Today','7 Days','30 Days','Quarter','Custom']}/>
      <Select value="" onChange={()=>{}} placeholder="All Teams" options={TEAMS.map(t=>t.name)}/>
      <Select value="" onChange={()=>{}} placeholder="All Services" options={SERVICES.map(s=>s.name)}/>
    </FilterBar>
    <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:12, marginBottom:16}}>
      <KPICard label="Total Tickets" value={allTickets.length} sub={incidents.length+' incidents · '+requests.length+' requests'} icon="ticket" onClick={()=>setView('all-tickets')}/>
      <KPICard label="Open Tickets" value={openTickets.length} sub="Active across all teams" icon="clock" tone="primary" onClick={()=>setView('all-tickets')}/>
      <KPICard label="Critical Incidents" value={critical.length} sub="P1, unresolved" icon="alertTriangle" tone="danger" onClick={()=>setView('incidents')}/>
      <KPICard label="SLA Breached" value={breached.length} sub="Needs immediate attention" icon="sla" tone="danger" onClick={()=>setView('sla')}/>
      <KPICard label="SLA At Risk" value={atRisk.length} sub="Within 25% of target" icon="clock" tone="warning" onClick={()=>setView('sla')}/>
      <KPICard label="Pending Approvals" value={pendingApprovals.length} sub="Awaiting decision" icon="approval" tone="warning" onClick={()=>setView('approvals')}/>
      <KPICard label="Open Problems" value={openProblems.length} sub="Root cause in progress" icon="problem" onClick={()=>setView('problems')}/>
      <KPICard label="Scheduled Changes" value={scheduledChanges.length} sub="Upcoming & in flight" icon="change" onClick={()=>setView('change-calendar')}/>
    </div>
    <div style={{display:'grid', gridTemplateColumns:'2fr 1fr', gap:14, marginBottom:14}}>
      <Card title="Ticket Trend (14 days)">
        <ChartCanvas type="line" data={{labels:trendData.labels, datasets:[
          {label:'Created', data:trendData.created, borderColor:CHART_COLORS.blue, backgroundColor:'transparent', tension:.3},
          {label:'Resolved', data:trendData.resolvedArr, borderColor:CHART_COLORS.green, backgroundColor:'transparent', tension:.3},
        ]}} options={{plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}}, scales:{x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}}}}}/>
      </Card>
      <Card title="Incidents by Priority">
        <ChartCanvas type="doughnut" data={{labels:['P1 Critical','P2 High','P3 Medium','P4 Low'], datasets:[{data:byPriority, backgroundColor:[CHART_COLORS.red,CHART_COLORS.amber,CHART_COLORS.blue,CHART_COLORS.gray]}]}}
          options={{plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:10.5}}}}}}/>
      </Card>
    </div>
    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14, marginBottom:14}}>
      <Card title="Tickets by Department">
        <ChartCanvas type="bar" data={{labels:DEPARTMENTS, datasets:[{label:'Tickets', data:byDept, backgroundColor:CHART_COLORS.blue}]}} options={{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}}}, y:{ticks:{font:{size:9}}}}}} height={200}/>
      </Card>
      <Card title="Tickets by Team">
        <ChartCanvas type="bar" data={{labels:TEAMS.map(t=>t.name.replace('IT ','')), datasets:[{label:'Tickets', data:byTeam, backgroundColor:CHART_COLORS.orange}]}} options={{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}}}, y:{ticks:{font:{size:9}}}}}} height={200}/>
      </Card>
      <Card title="SLA Compliance">
        <div style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:200}}>
          <div style={{fontSize:44, fontWeight:800, color: slaPct>=90?'var(--success)':slaPct>=75?'var(--warning)':'var(--danger)'}}>{slaPct}%</div>
          <div style={{fontSize:12, color:'var(--text-muted)', marginTop:4}}>of closed tickets met SLA</div>
          <div style={{width:'80%', marginTop:14}}><ProgressBar pct={slaPct/100} color={slaPct>=90?'var(--success)':slaPct>=75?'var(--warning)':'var(--danger)'}/></div>
        </div>
      </Card>
    </div>
    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
      <Card title="Top Recurring Problems">
        {state.problems.slice(0,5).map(p=>(
          <div key={p.id} onClick={()=>setView('problems')} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom:'1px solid var(--border)', cursor:'pointer'}}>
            <div><span className="mono" style={{fontSize:11, color:'var(--primary)'}}>{p.id}</span> <span style={{fontSize:12.5, marginLeft:6}}>{p.title}</span></div>
            <span style={{fontSize:11.5, color:'var(--text-faint)'}}>{p.relatedIncidents.length} incidents</span>
          </div>
        ))}
      </Card>
      <Card title="Service Health">
        {SERVICES.slice(0,7).map(s=>(
          <div key={s.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'7px 0', borderBottom:'1px solid var(--border)'}}>
            <span style={{fontSize:12.5}}>{s.name}</span>
            <StatusBadge status={s.status}/>
          </div>
        ))}
      </Card>
    </div>
    <Card title="Service Dependency Health"
      extra={<Button variant="default" size="sm" icon="external" onClick={()=>setView('topology')}>Open full topology</Button>}
      style={{marginTop:14, padding:12}}>
      <Topology3D cis={state.cis} selectedId={null} onSelect={(id)=>{ if(id) setView('topology'); }} height={340}/>
    </Card>
  </div>;
}
/* ============================= TICKET LIST VIEWS ============================= */
function unifyTickets(state){
  return [...state.incidents, ...state.requests].sort((a,b)=> new Date(b.createdDate)-new Date(a.createdDate));
}
function ticketColumns(onOpen){
  return [
    {key:'id', label:'ID', render:r=><span className="mono" style={{color:'var(--primary)', fontWeight:600}}>{r.id}</span>},
    {key:'type', label:'Type'},
    {key:'shortDescription', label:'Subject', render:r=> <span style={{fontWeight:500}}>{r.shortDescription||r.catalogItem}</span>},
    {key:'department', label:'Department'},
    {key:'priority', label:'Priority', render:r=> r.priority ? <PriorityBadge priority={r.priority}/> : '-'},
    {key:'status', label:'Status', render:r=><StatusBadge status={r.status}/>},
    {key:'assignGroup', label:'Team'},
    {key:'assignedAgent', label:'Agent'},
    {key:'sla', label:'SLA', sortable:false, render:r=><SLAMini ticket={r}/>},
    {key:'createdDate', label:'Created', render:r=>fmtDate(r.createdDate), sortValue:r=>new Date(r.createdDate)},
  ];
}
function TicketListView({title, data, state, onOpenTicket, showCreate, setView}){
  const [q, setQ] = useState('');
  const [statusF, setStatusF] = useState('');
  const [priorityF, setPriorityF] = useState('');
  const [teamF, setTeamF] = useState('');
  const filtered = data.filter(t=>{
    if(q && !( (t.id+' '+(t.shortDescription||t.catalogItem)+' '+(t.caller||t.requester)).toLowerCase().includes(q.toLowerCase()) )) return false;
    if(statusF && t.status!==statusF) return false;
    if(priorityF && t.priority!==priorityF) return false;
    if(teamF && t.assignGroup!==teamF) return false;
    return true;
  });
  const allStatuses = [...new Set(data.map(t=>t.status))];
  return <div>
    <FilterBar>
      <SearchInput value={q} onChange={setQ} placeholder="Search ID, subject, requester..." width={260}/>
      <Select value={statusF} onChange={setStatusF} placeholder="All Statuses" options={allStatuses}/>
      <Select value={priorityF} onChange={setPriorityF} placeholder="All Priorities" options={['P1','P2','P3','P4']}/>
      <Select value={teamF} onChange={setTeamF} placeholder="All Teams" options={TEAMS.map(t=>t.name)}/>
      <div style={{marginLeft:'auto', display:'flex', gap:8, alignItems:'center'}}>
        <span style={{fontSize:12, color:'var(--text-faint)'}}>{filtered.length} of {data.length}</span>
        {showCreate && <Button variant="primary" icon="plus" onClick={()=>setView('create-ticket')}>Create Ticket</Button>}
      </div>
    </FilterBar>
    <Card style={{padding:0}}>
      <DataTable columns={ticketColumns()} rows={filtered} onRowClick={(r)=>onOpenTicket(r.type==='Incident'?'incidents':'requests', r.id)} emptyText="No tickets match your filters."/>
    </Card>
  </div>;
}

/* ============================= AGENT WORKSPACE ============================= */
function AgentWorkspaceView({state, currentUser, onOpenTicket, setView}){

function ChangeCalendarView({state}){
  const [teamF, setTeamF] = useState(''); const [riskF, setRiskF] = useState('');
  const changes = state.changes.filter(c=> (!teamF||c.assignGroup===teamF) && (!riskF||c.risk===riskF));
  const today = new Date(); const year = today.getFullYear(); const month = today.getMonth();
  const firstDay = new Date(year, month, 1); const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = []; for(let i=0;i<startWeekday;i++) cells.push(null); for(let d=1; d<=daysInMonth; d++) cells.push(d);
  function changesOn(day){
    return changes.filter(c=>{ const s = new Date(c.plannedStart); return s.getFullYear()===year && s.getMonth()===month && s.getDate()===day; });
  }
  const upcoming = changes.filter(c=>new Date(c.plannedStart)>=today && !['Completed','Closed'].includes(c.status));
  const emergencyList = changes.filter(c=>c.type==='Emergency');
  const completedList = changes.filter(c=>['Completed','Closed'].includes(c.status));
  return <div>
    <FilterBar>
      <Select value={teamF} onChange={setTeamF} placeholder="All Teams" options={TEAMS.map(t=>t.name)}/>
      <Select value={riskF} onChange={setRiskF} placeholder="All Risk Levels" options={['Low','Medium','High']}/>
    </FilterBar>
    <div style={{display:'grid', gridTemplateColumns:'2.2fr 1fr', gap:14}}>
      <Card title={today.toLocaleDateString('en-GB',{month:'long', year:'numeric'})}>
        <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, fontSize:10.5, fontWeight:700, color:'var(--text-faint)', marginBottom:6, textTransform:'uppercase'}}>
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d} style={{textAlign:'center'}}>{d}</div>)}
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4}}>
          {cells.map((d,i)=>{
            const dayChanges = d ? changesOn(d) : [];
            const isToday = d===today.getDate();
            return <div key={i} style={{minHeight:76, border:'1px solid var(--border)', borderRadius:4, padding:5, background: isToday?'var(--info-bg)':'#fff'}}>
              {d && <div style={{fontSize:11, fontWeight:isToday?700:500, color: isToday?'var(--primary)':'var(--text-muted)', marginBottom:3}}>{d}</div>}
              {dayChanges.slice(0,2).map(c=>(
                <div key={c.id} title={c.title} style={{fontSize:9.5, padding:'2px 4px', marginBottom:2, borderRadius:3, background: c.type==='Emergency'?'var(--danger-bg)':'var(--info-bg)', color: c.type==='Emergency'?'var(--danger)':'var(--primary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{c.id.replace('CHG-2026-','#')}</div>
              ))}
              {dayChanges.length>2 && <div style={{fontSize:9, color:'var(--text-faint)'}}>+{dayChanges.length-2} more</div>}
            </div>;
          })}
        </div>
      </Card>
      <div style={{display:'flex', flexDirection:'column', gap:14}}>
        <Card title={'Upcoming ('+upcoming.length+')'}>
          {upcoming.slice(0,5).map(c=><div key={c.id} style={{fontSize:12, padding:'6px 0', borderBottom:'1px solid var(--border)'}}><span className="mono" style={{color:'var(--primary)'}}>{c.id}</span><div style={{color:'var(--text-muted)'}}>{c.title}</div></div>)}
          {upcoming.length===0 && <div style={{fontSize:12, color:'var(--text-faint)'}}>No upcoming changes.</div>}
        </Card>
        <Card title={'Emergency Changes ('+emergencyList.length+')'}>
          {emergencyList.slice(0,5).map(c=><div key={c.id} style={{fontSize:12, padding:'6px 0', borderBottom:'1px solid var(--border)'}}><span className="mono" style={{color:'var(--danger)'}}>{c.id}</span><div style={{color:'var(--text-muted)'}}>{c.title}</div></div>)}
          {emergencyList.length===0 && <div style={{fontSize:12, color:'var(--text-faint)'}}>None recorded.</div>}
        </Card>
        <Card title={'Completed ('+completedList.length+')'}>
          <div style={{fontSize:12, color:'var(--text-muted)'}}>{completedList.length} changes completed this period.</div>
        </Card>
      </div>
    </div>
  </div>;
}

function SLAView({state, onOpenTicket}){
  const allTickets = [...state.incidents, ...state.requests];
  const open = allTickets.filter(t=>!['Resolved','Closed','Completed'].includes(t.status));
  const breached = open.filter(t=>slaInfo(t).state==='Breached');
  const atRisk = open.filter(t=>slaInfo(t).state==='At Risk');
  const closed = allTickets.filter(t=>['Resolved','Closed','Completed'].includes(t.status));
  const met = closed.filter(t=>slaInfo(t).state==='Met');
  const compliance = closed.length ? Math.round(100*met.length/closed.length) : 100;
  const avgResolution = closed.length ? (closed.reduce((s,t)=> s + slaInfo(t).elapsedH, 0)/closed.length).toFixed(1) : 0;
  const avgResponse = (Object.values(SLA_RESPONSE_HOURS).reduce((a,b)=>a+b,0)/4).toFixed(1);
  const byPriority = ['P1','P2','P3','P4'].map(p=>{
    const rel = allTickets.filter(t=>t.priority===p);
    const relClosed = rel.filter(t=>['Resolved','Closed','Completed'].includes(t.status));
    const relMet = relClosed.filter(t=>slaInfo(t).state==='Met');
    return {p, target: SLA_HOURS[p], total: rel.length, compliance: relClosed.length ? Math.round(100*relMet.length/relClosed.length) : 100};
  });
  return <div>
    <div style={{display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:12, marginBottom:16}}>
      <KPICard label="SLA Compliance" value={compliance+'%'} tone={compliance>=90?'success':compliance>=75?'warning':'danger'} icon="sla"/>
      <KPICard label="Breached Tickets" value={breached.length} tone="danger" icon="alertTriangle"/>
      <KPICard label="At Risk" value={atRisk.length} tone="warning" icon="clock"/>
      <KPICard label="Avg Resolution Time" value={avgResolution+'h'} icon="clock"/>
      <KPICard label="Avg Response Time" value={avgResponse+'h'} icon="clock"/>
    </div>
    <Card title="SLA Policy by Priority" style={{marginBottom:14}}>
      <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12}}>
        {byPriority.map(row=>(
          <div key={row.p} style={{border:'1px solid var(--border)', borderRadius:'var(--radius-sm)', padding:12}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
              <PriorityBadge priority={row.p}/><span className="mono" style={{fontSize:11, color:'var(--text-faint)'}}>{row.target}h target</span>
            </div>
            <div style={{fontSize:22, fontWeight:700, color: row.compliance>=90?'var(--success)':row.compliance>=75?'var(--warning)':'var(--danger)'}}>{row.compliance}%</div>
            <div style={{fontSize:11, color:'var(--text-faint)'}}>{row.total} tickets</div>
          </div>
        ))}
      </div>
    </Card>
    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14}}>
      <Card title={'Breached ('+breached.length+')'} style={{padding:0}}>
        <DataTable columns={ticketColumns()} rows={breached} onRowClick={r=>onOpenTicket(r.type==='Incident'?'incidents':'requests', r.id)} emptyText="No breached tickets. Great work!"/>
      </Card>
      <Card title={'At Risk ('+atRisk.length+')'} style={{padding:0}}>
        <DataTable columns={ticketColumns()} rows={atRisk} onRowClick={r=>onOpenTicket(r.type==='Incident'?'incidents':'requests', r.id)} emptyText="No tickets at risk."/>
      </Card>
    </div>
  </div>;
}

/* ============================= 3D SERVICE TOPOLOGY (three.js) ============================= */
const CI_HEALTH = {
  'Operational': {hex:0x35A97A, css:'#35A97A'},
  'Degraded':    {hex:0xD9902A, css:'#D9902A'},
  'Down':        {hex:0xD9534F, css:'#D9534F'},
};
function healthOf(status){ return CI_HEALTH[status] || CI_HEALTH['Operational']; }

function makeLabelSprite(text, cssColor, scale){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  if(!ctx) return null;
  const font = '600 44px "IBM Plex Sans", sans-serif';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + 28;
  canvas.width = w; canvas.height = 64;
  const c2 = canvas.getContext('2d');
  c2.font = font; c2.textBaseline = 'middle'; c2.textAlign = 'center';
  c2.fillStyle = cssColor;
  c2.fillText(text, w/2, 34);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const sprite = new THREE.Sprite(mat);
  const s = scale || 1;
  sprite.scale.set((w/64)*1.5*s, 1.5*s, 1);
  return sprite;
}

/* Renders a tiered CMDB dependency graph in WebGL.
   Falls back to a flat tier list when WebGL is unavailable. */
function Topology3D({cis, selectedId, onSelect, height=520, focusId=null}){
  const mountRef = useRef(null);
  const stateRef = useRef({});
  const onSelectRef = useRef(onSelect);
  const [hovered, setHovered] = useState(null);
  const [failed, setFailed] = useState(false);
  const [paused, setPaused] = useState(false);
  useEffect(()=>{ onSelectRef.current = onSelect; }, [onSelect]);

  // Build the scene once per dataset
  useEffect(()=>{
    const mount = mountRef.current;
    if(!mount || typeof THREE === 'undefined') { setFailed(true); return; }
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    } catch(e){ setFailed(true); return; }
    if(!renderer || !renderer.domElement || !renderer.getContext || !renderer.getContext()){ setFailed(true); return; }

    const width = mount.clientWidth || 800;
    const h = height;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.setSize(width, h);
    mount.appendChild(renderer.domElement);
    renderer.domElement.style.display='block';
    renderer.domElement.style.cursor='grab';
    renderer.domElement.style.touchAction='none';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121821);
    scene.fog = new THREE.FogExp2(0x121821, 0.018);

    const camera = new THREE.PerspectiveCamera(45, width/h, 0.1, 400);
    scene.add(new THREE.AmbientLight(0x93A2B4, 0.95));
    const key = new THREE.DirectionalLight(0xFFFFFF, 0.65); key.position.set(14, 22, 16); scene.add(key);
    const rim = new THREE.DirectionalLight(0xC1622D, 0.28); rim.position.set(-16, -10, -12); scene.add(rim);

    // ---- layout: one horizontal ring per tier ----
    const tiers = [0,1,2,3];
    const tierY = {0: 12, 1: 4, 2: -4, 3: -12};
    const byTier = tiers.map(t=>cis.filter(c=>c.tier===t));
    const positions = {};
    const disposables = [];
    byTier.forEach((group, t)=>{
      const n = group.length || 1;
      const radius = Math.max(7.5, n * 1.2);
      group.forEach((ci, i)=>{
        const a = (i/n) * Math.PI*2 + (t * 0.4);
        positions[ci.id] = new THREE.Vector3(Math.cos(a)*radius, tierY[t], Math.sin(a)*radius);
      });
      const pts = [];
      for(let k=0;k<=96;k++){ const a=(k/96)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*radius, tierY[t], Math.sin(a)*radius)); }
      const ringGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const ringMat = new THREE.LineBasicMaterial({color:0x2A3442, transparent:true, opacity:0.8});
      scene.add(new THREE.Line(ringGeo, ringMat));
      disposables.push(ringGeo, ringMat);
    });

    // ---- edges ----
    const edges = [];
    cis.forEach(ci=>{
      ci.dependsOn.forEach(depId=>{
        const a = positions[ci.id], b = positions[depId];
        if(!a || !b) return;
        const mid = a.clone().add(b).multiplyScalar(0.5);
        mid.x *= 0.72; mid.z *= 0.72;
        const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
        const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(22));
        const mat = new THREE.LineBasicMaterial({color:0x35455A, transparent:true, opacity:0.75});
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        edges.push({line, mat, from:ci.id, to:depId});
        disposables.push(geo, mat);
      });
    });

    // ---- nodes ----
    const nodeMeshes = [];
    const sphereGeo = new THREE.SphereGeometry(1, 24, 18);
    disposables.push(sphereGeo);
    cis.forEach(ci=>{
      const pos = positions[ci.id];
      if(!pos) return;
      const load = (ci.relatedIncidents||[]).length;
      const r = 0.62 + Math.min(load, 6) * 0.075;
      const health = healthOf(ci.status);
      const mat = new THREE.MeshStandardMaterial({color:health.hex, roughness:0.42, metalness:0.28, emissive:health.hex, emissiveIntensity:0.18});
      const mesh = new THREE.Mesh(sphereGeo, mat);
      mesh.position.copy(pos);
      mesh.scale.setScalar(r);
      mesh.userData.ci = ci;
      mesh.userData.baseScale = r;
      scene.add(mesh);
      nodeMeshes.push(mesh);
      disposables.push(mat);

      const label = makeLabelSprite(ci.short, '#AEBBC9', 0.58);
      if(label){
        const idx = byTier[ci.tier].indexOf(ci);
        const lift = (idx % 2 === 0) ? 0.9 : 2.25;
        const outward = new THREE.Vector3(pos.x, 0, pos.z).normalize().multiplyScalar(2.1);
        label.position.set(pos.x + outward.x, pos.y + r + lift, pos.z + outward.z);
        scene.add(label);
        mesh.userData.label = label;
        disposables.push(label.material.map, label.material);
      }
    });

    // selection ring
    const ringGeo = new THREE.TorusGeometry(1.35, 0.055, 10, 48);
    const ringMat = new THREE.MeshBasicMaterial({color:0xC1622D});
    const selRing = new THREE.Mesh(ringGeo, ringMat);
    selRing.visible = false;
    scene.add(selRing);
    disposables.push(ringGeo, ringMat);

    // ---- camera orbit controls (hand-rolled; OrbitControls isn't in the core build) ----
    const CAM_DEFAULT = {theta: Math.PI*0.28, phi: Math.PI*0.42, radius: h < 400 ? 38 : 46};
    const cam = {...CAM_DEFAULT};
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function applyCamera(){
      const {theta, phi, radius} = cam;
      camera.position.set(
        radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(0,0,0);
    }
    applyCamera();

    let dragging = false, moved = false, lastX = 0, lastY = 0;
    const el = renderer.domElement;
    function onDown(e){ dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY; el.style.cursor='grabbing'; el.setPointerCapture && el.setPointerCapture(e.pointerId); }
    function onMove(e){
      const rect = el.getBoundingClientRect();
      stateRef.current.pointer = {x:((e.clientX-rect.left)/rect.width)*2-1, y:-((e.clientY-rect.top)/rect.height)*2+1};
      if(!dragging) return;
      const dx = e.clientX-lastX, dy = e.clientY-lastY;
      if(Math.abs(dx)+Math.abs(dy) > 3) moved = true;
      lastX = e.clientX; lastY = e.clientY;
      cam.theta -= dx*0.006;
      cam.phi = Math.max(0.22, Math.min(Math.PI-0.22, cam.phi - dy*0.006));
      applyCamera();
    }
    function onUp(e){
      if(dragging && !moved){
        const hit = stateRef.current.hoveredCi;
        if(onSelectRef.current) onSelectRef.current(hit ? hit.id : null);
      }
      dragging = false; el.style.cursor='grab';
    }
    function onWheel(e){
      e.preventDefault();
      cam.radius = Math.max(16, Math.min(78, cam.radius + e.deltaY*0.045));
      applyCamera();
    }
    function onLeave(){ stateRef.current.pointer = null; }
    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointerleave', onLeave);
    el.addEventListener('wheel', onWheel, {passive:false});

    // ---- render loop ----
    const raycaster = new THREE.Raycaster();
    let raf, frame = 0, lastHoverId = null;
    function tick(){
      raf = requestAnimationFrame(tick);
      frame++;
      if(!dragging && !reduceMotion && !stateRef.current.paused){ cam.theta += 0.0009; applyCamera(); }

      // hover picking (every 3rd frame is plenty)
      if(frame % 3 === 0){
        const p = stateRef.current.pointer;
        let hit = null;
        if(p){
          raycaster.setFromCamera(new THREE.Vector2(p.x, p.y), camera);
          const hits = raycaster.intersectObjects(nodeMeshes, false);
          if(hits.length) hit = hits[0].object.userData.ci;
        }
        stateRef.current.hoveredCi = hit;
        const hid = hit ? hit.id : null;
        if(hid !== lastHoverId){
          lastHoverId = hid;
          setHovered(hit);
          el.style.cursor = hit ? 'pointer' : (dragging ? 'grabbing' : 'grab');
        }
      }

      // pulse unhealthy nodes + emphasise selection/hover
      const sel = stateRef.current.selectedId;
      const pulse = 1 + Math.sin(frame*0.06)*0.08;
      nodeMeshes.forEach(m=>{
        const ci = m.userData.ci;
        const isSel = ci.id===sel, isHov = stateRef.current.hoveredCi && stateRef.current.hoveredCi.id===ci.id;
        const unhealthy = ci.status!=='Operational';
        let s = m.userData.baseScale * (unhealthy && !reduceMotion ? pulse : 1);
        if(isSel) s *= 1.45; else if(isHov) s *= 1.22;
        m.scale.setScalar(s);
        m.material.emissiveIntensity = isSel ? 0.75 : isHov ? 0.5 : (unhealthy ? 0.34 : 0.16);
        if(m.userData.label){
          const camDist = camera.position.length();
          const behind = m.position.distanceTo(camera.position) > camDist + 1.5;
          const lab = m.userData.label;
          if(isSel || isHov){ lab.visible = true; lab.material.opacity = 1; }
          else if(behind){ lab.visible = false; }
          else { lab.visible = true; lab.material.opacity = 0.72; }
        }
      });
      if(sel && positions[sel]){
        selRing.visible = true;
        selRing.position.copy(positions[sel]);
        selRing.lookAt(camera.position);
      } else { selRing.visible = false; }

      // highlight edges touching the selection
      edges.forEach(ed=>{
        const on = sel && (ed.from===sel || ed.to===sel);
        ed.mat.color.setHex(on ? 0xC1622D : 0x35455A);
        ed.mat.opacity = on ? 1 : 0.7;
      });

      // keep the tier rail aligned with where each plane actually lands on screen
      const rails = stateRef.current.railEls;
      if(rails){
        const v = new THREE.Vector3();
        tiers.forEach(t=>{
          const el2 = rails[t];
          if(!el2) return;
          v.set(0, tierY[t], 0).project(camera);
          el2.style.top = (((1 - v.y) / 2) * h) + 'px';
        });
      }

      renderer.render(scene, camera);
    }
    tick();

    // ---- resize ----
    let ro;
    const resize = ()=>{
      const w = mount.clientWidth || width;
      renderer.setSize(w, h);
      camera.aspect = w/h; camera.updateProjectionMatrix();
    };
    if(typeof ResizeObserver !== 'undefined'){ ro = new ResizeObserver(resize); ro.observe(mount); }
    else window.addEventListener('resize', resize);

    stateRef.current.focus = (id)=>{
      const p = positions[id];
      if(!p) return;
      cam.theta = Math.atan2(p.z, p.x);
      applyCamera();
    };
    stateRef.current.reset = ()=>{ Object.assign(cam, CAM_DEFAULT); applyCamera(); };

    return ()=>{
      cancelAnimationFrame(raf);
      if(ro) ro.disconnect(); else window.removeEventListener('resize', resize);
      el.removeEventListener('pointerdown', onDown);
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointerleave', onLeave);
      el.removeEventListener('wheel', onWheel);
      disposables.forEach(d=>{ if(d && d.dispose) d.dispose(); });
      renderer.dispose();
      if(el.parentNode) el.parentNode.removeChild(el);
    };
  }, [cis, height]);

  // keep the render loop aware of the current selection without rebuilding the scene
  useEffect(()=>{ stateRef.current.selectedId = selectedId; }, [selectedId]);
  useEffect(()=>{ if(focusId && stateRef.current.focus) stateRef.current.focus(focusId); }, [focusId]);

  if(failed){
    return <div style={{padding:16, background:'#121821', borderRadius:'var(--radius-sm)', color:'#AEB8C4'}}>
      <div style={{fontSize:12.5, marginBottom:12, color:'#8C99A8'}}>3D view unavailable in this browser — showing the dependency tiers as a list.</div>
      {CI_TIERS.map((t,ti)=>(
        <div key={t} style={{marginBottom:10}}>
          <div style={{fontSize:10.5, fontWeight:700, letterSpacing:.5, color:'#5E6C7D', marginBottom:5}}>{t.toUpperCase()}</div>
          <div style={{display:'flex', flexWrap:'wrap', gap:6}}>
            {cis.filter(c=>c.tier===ti).map(c=>(
              <span key={c.id} onClick={()=>onSelect && onSelect(c.id)} style={{cursor:'pointer', fontSize:11.5, padding:'4px 10px', borderRadius:20, background:'#1D2531', color: healthOf(c.status).css, border:'1px solid '+(selectedId===c.id?'#C1622D':'#2C3746')}}>{c.short}</span>
            ))}
          </div>
        </div>
      ))}
    </div>;
  }

  return <div style={{position:'relative', borderRadius:'var(--radius-sm)', overflow:'hidden', background:'#121821'}}>
    <div ref={mountRef} style={{width:'100%', height}}/>
    {/* tier rail — each label is pinned to where its plane actually projects on screen */}
    {CI_TIERS.map((t,i)=>(
      <div key={t} ref={el=>{ if(!stateRef.current.railEls) stateRef.current.railEls = {}; stateRef.current.railEls[i] = el; }}
        style={{position:'absolute', left:14, top:0, transform:'translateY(-50%)', display:'flex', alignItems:'center', gap:7, pointerEvents:'none'}}>
        <span style={{width:16, height:1, background:'#39465A'}}/>
        <span style={{fontSize:9.5, fontWeight:700, letterSpacing:.7, color:'#64748A'}}>{t.toUpperCase()}</span>
      </div>
    ))}
    <div style={{position:'absolute', top:12, left:14, display:'flex', gap:14, fontSize:11, color:'#8C99A8', pointerEvents:'none'}}>
      {Object.entries(CI_HEALTH).map(([k,v])=>(
        <span key={k} style={{display:'flex', alignItems:'center', gap:5}}>
          <span style={{width:7, height:7, borderRadius:'50%', background:v.css}}/>{k}
        </span>
      ))}
    </div>
    <div style={{position:'absolute', bottom:12, right:14, display:'flex', gap:6}}>
      <button onClick={()=>{ stateRef.current.paused = !stateRef.current.paused; setPaused(p=>!p); }} className="focus-ring"
        style={{background:'rgba(28,36,48,0.9)', border:'1px solid #2C3746', color:'#AEBBC9', borderRadius:4, padding:'5px 10px', fontSize:11, fontFamily:'inherit', cursor:'pointer'}}>
        {paused ? 'Resume rotation' : 'Pause rotation'}
      </button>
      <button onClick={()=>stateRef.current.reset && stateRef.current.reset()} className="focus-ring"

    <div style={{position:'absolute', bottom:12, left:14, fontSize:10.5, color:'#5E6C7D', pointerEvents:'none'}}>Drag to orbit · scroll to zoom · click a node to inspect</div>
    {hovered && <div style={{position:'absolute', top:12, right:14, background:'rgba(20,26,34,0.92)', border:'1px solid #2C3746', borderRadius:'var(--radius-sm)', padding:'8px 12px', pointerEvents:'none', maxWidth:230}}>

function TeamsView({state}){

    const open = teamTickets.filter(x=>!['Resolved','Closed','Completed'].includes(x.status));

const REPORT_LIST = ['Ticket Volume','Incident Analysis','Service Requests','SLA Compliance','Team Performance','Agent Performance','Problem Analysis','Change Management','Asset Report','Service Performance'];
